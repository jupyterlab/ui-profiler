# a mybinder.org-ready environment for demoing jupyterlab-ui-profiler
# this environment may also be used locally on Linux/MacOS/Windows, e.g.
#
#   conda env update --file binder/environment.yml
#   conda activate jupyterlab-ui-profiler-demo
#
name: jupyterlab-ui-profiler-demo

channels:
  - conda-forge

dependencies:
  # runtime dependencies
  - python >=3.10,<3.14.0a0
  - jupyterlab >=4.5.0rc,<5.0.0a0
  # labextension build dependencies
  - nodejs >=22,<24
  - pip
  - wheel
  # additional packages for demos
  # - ipywidgets
